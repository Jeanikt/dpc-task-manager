services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${JWT_KEY:-docker-demo-key-troque-em-producao-0123456789}
      Swagger__Enabled: "true"
      Seed__Enabled: "true"
      Seed__AdminEmail: admin@dpc.local
      Seed__AdminPassword: Admin@123
      Seed__UserEmail: usuario@dpc.local
      Seed__UserPassword: Usuario@123
      Cors__AllowedOrigins__0: http://localhost:8080
      ReverseProxy__Enabled: "true"
    expose:
      - "8080"
    volumes:
      - taskmanager-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  taskmanager-data:
